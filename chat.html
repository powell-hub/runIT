<!DOCTYPE html>
<html>
<head>
  <title>RunIT Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#ece5dd;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    .header{
      background:#5b3df5;
      color:white;
      padding:15px;
      font-size:20px;
      font-weight:bold;
    }

    #messages{
      flex:1;
      overflow-y:auto;
      padding:15px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .message{
      max-width:70%;
      padding:10px 14px;
      border-radius:18px;
      font-size:15px;
      line-height:1.4;
      word-wrap:break-word;
    }

    .sent{
      align-self:flex-end;
      background:#5b3df5;
      color:white;
      border-bottom-right-radius:4px;
    }

    .received{
      align-self:flex-start;
      background:white;
      color:black;
      border-bottom-left-radius:4px;
    }

    .input-area{
      display:flex;
      padding:10px;
      background:white;
      gap:10px;
    }

    #messageInput{
      flex:1;
      padding:12px;
      border:none;
      border-radius:30px;
      background:#f1f1f1;
      outline:none;
      font-size:15px;
    }

    #sendBtn{
      background:#5b3df5;
      color:white;
      border:none;
      width:50px;
      height:50px;
      border-radius:50%;
      cursor:pointer;
      font-size:18px;
    }
  </style>
</head>

<body>

<div class="header" id="chatHeader">RunIT Chat</div>
<div id="taskInfo" style="
  padding:10px 15px;
  font-size:13px;
  background:#fff;
  border-bottom:1px solid #eee;
  color:#555;
"></div>
  
  <div id="messages"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button id="sendBtn">➤</button>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script src="firebase.js"></script>

  <script>
    const sendBtn = document.getElementById("sendBtn");
    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    const db = firebase.firestore();

let currentUser = null;
let currentUserData = null;
    
    // 🔥 GET TASK ID
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get("task");

    if (!taskId) {
      alert("No task selected");
      window.location.href = "tasks.html";
    }

    const chatId = "task_" + taskId;
    const chatRef = db.collection("chats").doc(chatId).collection("messages");
    const taskInfoDiv = document.getElementById("taskInfo");

db.collection("tasks").doc(taskId).get().then((doc) => {

  if (!doc.exists) return;

  const task = doc.data();

  taskInfoDiv.innerHTML = `
    <b>Task:</b> ${task.title || "Untitled"} <br>
    <b>Price:</b> ₦${task.price || 0} <br>
    <b>Status:</b> ${task.status || "unknown"}
  `;

});
    db.collection("chats").doc(chatId).get().then((doc) => {

  const data = doc.data();

  const otherUser = data.participants.find(id => id !== currentUser);

  if (otherUser) {
    document.getElementById("chatHeader").innerText =
      "Chat with user";
  }

});

    // 🔥 AUTH + SECURITY CHECK + CHAT INIT
    firebase.auth().onAuthStateChanged(async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user.uid;
      db.collection("users").doc(user.uid).get().then((doc) => {
  currentUserData = doc.data();
});

      const chatDoc = await db.collection("chats").doc(chatId).get();

      if (!chatDoc.exists) {
        alert("Chat not found");
        window.location.href = "tasks.html";
        return;
      }

      const chatData = chatDoc.data();

      if (!chatData.participants || !chatData.participants.includes(currentUser)) {
        alert("Access denied");
        window.location.href = "tasks.html";
        return;
      }

      // 🔥 ONLY START LISTENER AFTER AUTH PASS
      chatRef.orderBy("createdAt").onSnapshot((snapshot) => {

        messages.innerHTML = "";

        snapshot.forEach((doc) => {
          const data = doc.data();

          const messageDiv = document.createElement("div");
          messageDiv.classList.add("message");

          if (data.sender === currentUser) {
            messageDiv.classList.add("sent");
          } else {
            messageDiv.classList.add("received");
          }

messageDiv.innerHTML = `
  <b style="font-size:12px; display:block; color:#999;">
    ${data.senderName || "User"}
  </b>
  ${data.text}
`;
        messages.appendChild(messageDiv);
        });

        messages.scrollTop = messages.scrollHeight;
      });

    });

    // SEND MESSAGE
    function sendMessage() {
      const text = messageInput.value.trim();
      if (text === "" || !currentUser) return;

      chatRef.add({
  text: text,
  sender: currentUser,
senderName: currentUserData?.username || "User",
createdAt: firebase.firestore.FieldValue.serverTimestamp()
})
      messageInput.value = "";
    }

    sendBtn.addEventListener("click", sendMessage);

    messageInput.addEventListener("keypress", function(e){
      if (e.key === "Enter") {
        sendMessage();
      }
    });

  </script>

</body>
</html>
