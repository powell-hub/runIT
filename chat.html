<!DOCTYPE html>
<html>
<head>
  <title>RunIT Chat</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#ece5dd;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* HEADER */

    .header{
      background:#5b3df5;
      color:white;
      padding:15px;
      font-size:20px;
      font-weight:bold;
    }

    /* CHAT AREA */

    #messages{
      flex:1;
      overflow-y:auto;
      padding:15px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    /* MESSAGE BUBBLES */

    .message{
      max-width:70%;
      padding:10px 14px;
      border-radius:18px;
      font-size:15px;
      line-height:1.4;
    }

    .sent{
      align-self:flex-end;
      background:#5b3df5;
      color:white;
      border-bottom-right-radius:4px;
    }

    .received{
      align-self:flex-start;
      background:white;
      color:black;
      border-bottom-left-radius:4px;
    }

    /* INPUT AREA */

    .input-area{
      display:flex;
      padding:10px;
      background:white;
      gap:10px;
    }

    #messageInput{
      flex:1;
      padding:12px;
      border:none;
      border-radius:30px;
      background:#f1f1f1;
      outline:none;
      font-size:15px;
    }

    #sendBtn{
      background:#5b3df5;
      color:white;
      border:none;
      padding:12px 18px;
      border-radius:50%;
      cursor:pointer;
      font-size:18px;
    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    RunIT Chat
  </div>

  <!-- MESSAGES -->
  <div id="messages">

    <!-- TEST MESSAGES -->

    <div class="message received">
      Hello 👋
    </div>

    <div class="message sent">
      Hi bro
    </div>

  </div>

  <!-- INPUT -->
  <div class="input-area">

    <input
      type="text"
      id="messageInput"
      placeholder="Type a message..."
    >

    <button id="sendBtn">
      ➤
    </button>

  </div>

</body>
</html>
