<!DOCTYPE html>
<html>
<head>
  <title>RunIT Chat</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#ece5dd;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* HEADER */

    .header{
      background:#5b3df5;
      color:white;
      padding:15px;
      font-size:20px;
      font-weight:bold;
    }

    /* CHAT AREA */

    #messages{
      flex:1;
      overflow-y:auto;
      padding:15px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    /* MESSAGE */

    .message{
      max-width:70%;
      padding:10px 14px;
      border-radius:18px;
      font-size:15px;
      line-height:1.4;
      word-wrap:break-word;
    }

    .sent{
      align-self:flex-end;
      background:#5b3df5;
      color:white;
      border-bottom-right-radius:4px;
    }

    .received{
      align-self:flex-start;
      background:white;
      color:black;
      border-bottom-left-radius:4px;
    }

    /* INPUT AREA */

    .input-area{
      display:flex;
      padding:10px;
      background:white;
      gap:10px;
    }

    #messageInput{
      flex:1;
      padding:12px;
      border:none;
      border-radius:30px;
      background:#f1f1f1;
      outline:none;
      font-size:15px;
    }

    #sendBtn{
      background:#5b3df5;
      color:white;
      border:none;
      width:50px;
      height:50px;
      border-radius:50%;
      cursor:pointer;
      font-size:18px;
    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    RunIT Chat
  </div>

  <!-- CHAT AREA -->
  <div id="messages"></div>

  <!-- INPUT -->
  <div class="input-area">

    <input
      type="text"
      id="messageInput"
      placeholder="Type a message..."
    >

    <button id="sendBtn">
      ➤
    </button>

  </div>

  <script>

    const sendBtn = document.getElementById("sendBtn");
    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    // SEND MESSAGE
    function sendMessage(){

      const text = messageInput.value.trim();

      // PREVENT EMPTY MESSAGE
      if(text === ""){
        return;
      }

      // CREATE MESSAGE DIV
      const messageDiv = document.createElement("div");

      messageDiv.classList.add("message");
      messageDiv.classList.add("sent");

      messageDiv.innerText = text;

      // ADD TO CHAT
      messages.appendChild(messageDiv);

      // CLEAR INPUT
      messageInput.value = "";

      // AUTO SCROLL
      messages.scrollTop = messages.scrollHeight;
    }

    // BUTTON CLICK
    sendBtn.addEventListener("click", sendMessage);

    // ENTER KEY
    messageInput.addEventListener("keypress", function(e){

      if(e.key === "Enter"){
        sendMessage();
      }

    });

  </script>

</body>
</html>
